name: Radar Scheduler Watchdog
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 0,12 * * *"
  workflow_dispatch:
jobs:
  arm:
    runs-on: ubuntu-latest
    steps:
      - name: Re-arm singleton alarm if necessary
        run: |
          curl --location --max-time 30 --retry 2 --show-error \
            --output ./health-response.txt \
            --write-out 'HTTP %{http_code} bytes %{size_download}\n' \
            https://openrouter-radar.zhajiahe1994.workers.dev/api/health
          head -c 500 ./health-response.txt || true
