name: Deploy Cloudflare Worker
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-production
  cancel-in-progress: false

jobs:
  deploy:
    # GitHub Actions is the sole production deployment owner.
    # This job validates, migrates D1 and deploys on every main push.
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID OPENROUTER_API_KEY; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $key"
              exit 1
            fi
          done

      - name: Install, typecheck, test and build
        env:
          VITE_SITE_ORIGIN: ${{ vars.APP_ORIGIN }}
        run: |
          npm install
          npm run check

      - name: Create ephemeral deployment config
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          OPEN_SIGNUP: ${{ vars.OPEN_SIGNUP }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if(process.env.D1_DATABASE_ID) c.d1_databases[0].database_id=process.env.D1_DATABASE_ID;
          if(process.env.APP_ORIGIN) c.vars.APP_ORIGIN=process.env.APP_ORIGIN;
          if(process.env.MAIL_FROM) c.vars.MAIL_FROM=process.env.MAIL_FROM;
          if(process.env.OPEN_SIGNUP) c.vars.OPEN_SIGNUP=process.env.OPEN_SIGNUP;
          if(!/^[a-f0-9-]{36}$/i.test(c.d1_databases[0].database_id))throw new Error('A valid D1 database_id is required');
          if(!c.vars.APP_ORIGIN.startsWith('https://'))throw new Error('Production APP_ORIGIN must use HTTPS');
          fs.writeFileSync('wrangler.deploy.json',JSON.stringify(c,null,2));
          NODE

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.deploy.json

      - name: Deploy Worker with operator secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const secrets={OPENROUTER_API_KEY:process.env.OPENROUTER_API_KEY};
          if(process.env.RESEND_API_KEY)secrets.RESEND_API_KEY=process.env.RESEND_API_KEY;
          fs.writeFileSync('.radar-secrets.json',JSON.stringify(secrets),{mode:0o600});
          NODE
          trap 'rm -f .radar-secrets.json' EXIT
          npx wrangler deploy --config wrangler.deploy.json --secrets-file .radar-secrets.json

      - name: Smoke-test deployed Worker
        shell: bash
        run: |
          ORIGIN=$(node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('wrangler.deploy.json','utf8')); console.log(c.vars.APP_ORIGIN)")
          # The first health request can return 503 before initial catalogue sync.
          code=$(curl -sS -L --retry 2 --connect-timeout 10 --max-time 30 -o /tmp/radar-health.json -w '%{http_code}' "$ORIGIN/api/health")
          echo "Health HTTP status: $code"
          cat /tmp/radar-health.json
          echo
          if [[ "$code" != "200" && "$code" != "503" ]]; then
            echo "::error::Unexpected health HTTP status $code"
            exit 1
          fi
          echo "### OpenRouter Radar deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $ORIGIN" >> "$GITHUB_STEP_SUMMARY"
          echo "Health HTTP status: $code" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-test observed-price migration and analytics
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN=$(node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('wrangler.deploy.json','utf8')); console.log(c.vars.APP_ORIGIN)")
          # A nonexistent model must still exercise the new price_observations table.
          curl -fLsS --retry 2 --connect-timeout 10 --max-time 30             -o /tmp/radar-cache-history.json "$ORIGIN/api/price-history?model_id=radar-smoke/nonexistent&dimension=cache_read"
          # Regression for the historical 500: cached Responses have immutable headers.
          # A single cold request can pass while the second (cached) request fails in Hono secureHeaders.
          # Test both windows three times without retries, so a transient 500 cannot be hidden.
          for days in 7 30; do
            for attempt in 1 2 3; do
              output="/tmp/radar-analytics-${days}-${attempt}.json"
              curl -fLsS --connect-timeout 10 --max-time 30 \
                -o "$output" "$ORIGIN/api/analytics?days=$days"
              ANALYTICS_FILE="$output" ANALYTICS_DAYS="$days" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result=JSON.parse(fs.readFileSync(process.env.ANALYTICS_FILE,'utf8'));
          const days=Number(process.env.ANALYTICS_DAYS);
          if(result.days!==days || !Array.isArray(result.daily) || result.daily.length!==days ||
             !Array.isArray(result.modelKinds) || !Array.isArray(result.topProviders) ||
             !Array.isArray(result.priceDimensions))throw new Error('Analytics contract invalid for '+days+' days');
          NODE
              echo "Analytics ${days}d request #${attempt}: success"
            done
          done
          cp /tmp/radar-analytics-7-3.json /tmp/radar-analytics.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const history=JSON.parse(fs.readFileSync('/tmp/radar-cache-history.json','utf8'));
          const analytics=JSON.parse(fs.readFileSync('/tmp/radar-analytics.json','utf8'));
          if(!Array.isArray(history.data)||!Array.isArray(history.dimensions)||
             !history.dimensions.some(d=>d.dimension==='cache_read'))throw new Error('Cache history contract unavailable');
          if(!Array.isArray(analytics.priceDimensions)||!Array.isArray(analytics.daily))throw new Error('Analytics contract unavailable');
          console.log('Price observations and dimension analytics verified');
          NODE
      - name: Smoke-test React homepage and static assets
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN=$(node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('wrangler.deploy.json','utf8')); console.log(c.vars.APP_ORIGIN)")
          echo "Checking public frontend at $ORIGIN/"
          curl -fLsS --retry 2 --connect-timeout 10 --max-time 30 \
            --header 'Accept: text/html' -o /tmp/radar-home.html "$ORIGIN/"
          grep -qi '<title>OpenRouter Radar</title>' /tmp/radar-home.html || {
            echo "::error::Homepage did not return the React HTML document"
            head -c 300 /tmp/radar-home.html
            exit 1
          }
          JS_PATH=$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/radar-home.html | head -1 | cut -d '"' -f2)
          CSS_PATH=$(grep -oE 'href="/assets/[^"]+\.css"' /tmp/radar-home.html | head -1 | cut -d '"' -f2)
          if [[ -z "$JS_PATH" || -z "$CSS_PATH" ]]; then
            echo "::error::Built React JS/CSS asset references are missing from homepage"
            exit 1
          fi
          curl -fLsS --retry 2 --connect-timeout 10 --max-time 30 -o /tmp/radar-app.js "$ORIGIN$JS_PATH"
          curl -fLsS --retry 2 --connect-timeout 10 --max-time 30 -o /tmp/radar-style.css "$ORIGIN$CSS_PATH"
          test -s /tmp/radar-app.js
          test -s /tmp/radar-style.css
          # Guard against SPA fallback HTML being served for missing brand assets.
          for image in favicon.ico favicon-32.png apple-touch-icon.png icon-192.png icon-512.png social-card.png; do
            curl -fLsS --retry 2 --connect-timeout 10 --max-time 30 -o "/tmp/$image" "$ORIGIN/$image"
            ASSET="/tmp/$image" node --input-type=module -e "import fs from 'node:fs'; const p=process.env.ASSET; const data=fs.readFileSync(p); const expected=p.endsWith('.ico')?'00000100':'89504e47'; if(data.subarray(0,4).toString('hex')!==expected)process.exit(1)"
          done
          curl -fLsS --retry 2 --connect-timeout 10 --max-time 30 -o /tmp/radar-manifest.json "$ORIGIN/site.webmanifest"
          node --input-type=module -e "import fs from 'node:fs'; const m=JSON.parse(fs.readFileSync('/tmp/radar-manifest.json')); if(!m.icons?.some(i=>i.sizes==='512x512'))process.exit(1)"
          echo "React homepage, JavaScript and stylesheet are publicly accessible"
          echo "Browser icons, mobile icons, manifest and social image verified"
          echo "Frontend: $ORIGIN/" >> "$GITHUB_STEP_SUMMARY"
          echo "Assets: JS and CSS fetched successfully" >> "$GITHUB_STEP_SUMMARY"

